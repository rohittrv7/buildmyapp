<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Launch Checklist — BuildMyApp</title><style>body{max-width:760px;margin:64px auto;padding:0 24px;background:#10120f;color:#f5f7f2;font:16px system-ui}h1{font-size:40px}label{display:block;padding:16px;border-bottom:1px solid #30352e}input{accent-color:#c8ff45;margin-right:12px}button{margin-top:20px;padding:12px;border:0;border-radius:6px;background:#c8ff45;cursor:pointer}</style><h1>Launch Checklist</h1><p>Make launch day feel less like a surprise.</p><div id="items"></div><button id="reset">Reset checklist</button><script>const names=['Confirm the app name and store listing','Test the key flow on a real device','Check empty, loading, and offline states','Review privacy and permissions','Prepare support contact and release notes','Back up the release build'];const key='bmaLaunchChecklist';let checked=JSON.parse(localStorage[key]||'[]');const box=document.querySelector('#items');names.forEach((n,i)=>{const l=document.createElement('label'),c=document.createElement('input');c.type='checkbox';c.checked=checked.includes(i);c.onchange=()=>{checked=c.checked?[...checked,i]:checked.filter(x=>x!==i);localStorage[key]=JSON.stringify(checked)};l.append(c,document.createTextNode(n));box.append(l)});document.querySelector('#reset').onclick=()=>{localStorage.removeItem(key);location.reload()}</script></html>
