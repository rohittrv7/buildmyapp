<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meeting Math — BuildMyApp</title><style>body{max-width:760px;margin:64px auto;padding:0 24px;background:#10120f;color:#f5f7f2;font:16px system-ui}h1{font-size:40px}label{display:block;margin:20px 0 8px;color:#bcc4b4}input{display:block;background:#191d17;color:inherit;border:1px solid #596052;padding:12px;border-radius:6px;width:100%;box-sizing:border-box}output{display:block;color:#c8ff45;font-size:48px;margin-top:24px}</style><h1>Meeting Math</h1><p>Estimate the people-time cost of a meeting.</p><label>People</label><input id="people" type="number" min="1" value="5"><label>Minutes</label><input id="minutes" type="number" min="1" value="30"><label>Average hourly cost per person (currency units)</label><input id="rate" type="number" min="0" value="25"><output id="total"></output><script>const els=['people','minutes','rate'].map(id=>document.getElementById(id));function calc(){const [p,m,r]=els.map(e=>Math.max(0,Number(e.value)||0));document.getElementById('total').textContent=new Intl.NumberFormat(undefined,{style:'currency',currency:'USD',maximumFractionDigits:0}).format(p*m/60*r)}els.forEach(e=>e.addEventListener('input',calc));calc()</script></html>
