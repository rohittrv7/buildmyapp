<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Focus Board — BuildMyApp</title><style>body{max-width:760px;margin:64px auto;padding:0 24px;background:#10120f;color:#f5f7f2;font:16px system-ui}h1{font-size:40px}small{color:#a7b09d}input{background:#191d17;color:inherit;border:1px solid #596052;padding:12px;width:70%;border-radius:6px}button{padding:12px;border:0;border-radius:6px;background:#c8ff45;cursor:pointer}li{padding:12px;border-bottom:1px solid #30352e}input[type=checkbox]{width:auto}form{display:flex;gap:8px;margin:24px 0}</style><h1>Focus Board</h1><small>Three things worth moving forward today.</small><form id="add"><input id="task" maxlength="120" placeholder="Add a priority" required><button>Add</button></form><ul id="list"></ul><script>const list=document.querySelector('#list');let tasks=JSON.parse(localStorage.focusBoard||'[]');function draw(){list.replaceChildren();tasks.forEach((t,i)=>{const li=document.createElement('li'),cb=document.createElement('input'),s=document.createElement('span'),rm=document.createElement('button');cb.type='checkbox';cb.checked=t.done;cb.onchange=()=>{tasks[i].done=cb.checked;save()};s.textContent=' '+t.text;s.style.textDecoration=t.done?'line-through':'none';rm.textContent='Remove';rm.onclick=()=>{tasks.splice(i,1);save()};li.append(cb,s,document.createTextNode(' '),rm);list.append(li)})}function save(){localStorage.focusBoard=JSON.stringify(tasks);draw()}document.querySelector('#add').onsubmit=e=>{e.preventDefault();const text=document.querySelector('#task').value.trim();if(text&&tasks.length<3){tasks.push({text,done:false});save();e.target.reset()}};draw()</script></html>
